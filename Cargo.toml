[package]
name = "basalt"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
description = "Basalt - native Rust Discord client. No WebView, no Electron."
license = "MIT"
repository = "https://github.com/sandinok/basalt"
homepage = "https://github.com/sandinok/basalt"
keywords = ["discord", "egui", "native", "client", "chat"]
categories = ["gui"]
publish = false
default-run = "basalt"

[[bin]]
name = "basalt"
path = "src/main.rs"

[dependencies]
egui = "=0.36.1"
eframe = { version = "=0.36.1", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }

tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "parking_lot"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }

reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream", "gzip"] }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order", "raw_value"] }

flate2 = { version = "1.1.10", default-features = false, features = ["zlib"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }

tracing = { version = "0.1.44", features = ["attributes"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt", "time", "ansi"] }

thiserror = "2.0.20"
anyhow = "1.0.98"

dirs = "6.0.0"
toml = "0.9.5"
time = { version = "0.3.41", features = ["serde", "parsing", "formatting"] }

aes-gcm = "0.11.1"
sha2 = "0.11.0"
getrandom = "0.3.3"
base64 = "0.22.1"
hex = "0.4.3"

parking_lot = "0.12.5"
dashmap = "6.2.1"
arc-swap = "1.9.2"

bytes = "1.12.1"
url = "2.5.4"
once_cell = "1.21.3"
futures-util = "0.3.31"
open = "5.3.2"
humansize = "2.1.3"

# Optional voice dependencies. Enabled only via `--features voice`.
opus = { version = "0.4.0", optional = true }
libsodium-sys = { version = "0.2.7", optional = true }
cpal = { version = "0.18.2", optional = true }
crossbeam = { version = "0.8.4", optional = true }

[features]
default = []
voice = ["dep:opus", "dep:libsodium-sys", "dep:cpal", "dep:crossbeam"]

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = 0

[profile.dev]
opt-level = 1
debug = 1

[profile.release.package."*"]
opt-level = "z"
codegen-units = 1
